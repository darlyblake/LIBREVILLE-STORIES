name: Download CC0 PBR textures

on:
  push:
    branches: [main]
    paths:
      - "tools/download_cc0_textures.py"
      - ".github/workflows/download-cc0-textures.yml"
  workflow_dispatch:
    inputs:
      resolution:
        description: Texture resolution
        required: true
        default: "4k"
        type: choice
        options:
          - "1k"
          - "2k"
          - "4k"

permissions:
  contents: write

concurrency:
  group: cc0-pbr-textures
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Poly Haven CC0 materials
        run: |
          python tools/download_cc0_textures.py --resolution "${{ github.event.inputs.resolution || '4k' }}"

      - name: Commit downloaded materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/textures/pbr assets/sky
          if git diff --cached --quiet; then
            echo "No new texture files to commit."
            exit 0
          fi
          git commit -m "assets: add Poly Haven CC0 PBR materials"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concurrent détecté, nouvelle tentative ($attempt/5)."
            sleep 3
          done
          echo "Impossible de publier les textures après cinq tentatives."
          exit 1

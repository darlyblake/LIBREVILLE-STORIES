name: Extract extended Libreville OSM layers

on:
  push:
    branches: [main]
    paths:
      - "tools/map-generator/extract_libreville_extended.py"
      - "tools/map-generator/extract_libreville.py"\n      - "tools/map-generator/report_bridge_geometry.py"
      - ".github/workflows/extract-extended-osm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extended-osm-main
  cancel-in-progress: false

jobs:
  extract-osm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry and OSM PBF dependencies
        run: python -m pip install --upgrade pip shapely osmium
      - name: Extract extended OSM layers
        run: |
          python tools/map-generator/extract_libreville_extended.py \
            --south 0.300 --west 9.370 --north 0.500 --east 9.550 --grid 4 --timeout 60 --source geofabrik
      - name: Validate generated layers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/osm/extended")
          report = json.loads((root / "extraction-report.json").read_text())
          required = ["roads.geojson", "buildings.geojson", "environment.geojson",
                      "localities.geojson", "neighbourhoods.geojson", "pois.geojson"]
          for name in required:
              path = root / name
              data = json.loads(path.read_text())
              assert data.get("type") == "FeatureCollection", name
              print(f"{name}: {len(data.get('features', []))} objets")
          assert report["bbox_south_west_north_east"] == [0.3, 9.37, 0.5, 9.55]
          assert len(json.loads((root / "roads.geojson").read_text())["features"]) >= 1000
          assert len(json.loads((root / "buildings.geojson").read_text())["features"]) >= 10000
          PY
      - name: Report bridge geometry without inventing structural dimensions\n        run: python tools/map-generator/report_bridge_geometry.py\n      - name: Save extended OSM layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm/extended/*.geojson data/osm/extended/extraction-report.json data/osm/extended/bridge-geometry-report.json
          git commit -m "data: ajouter les couches OSM de la zone étendue"
          git pull --rebase origin main
          git push
      - name: Upload extraction report
        uses: actions/upload-artifact@v4
        with:
          name: libreville-osm-extended
          path: data/osm/extended/*
          if-no-files-found: error
          retention-days: 30

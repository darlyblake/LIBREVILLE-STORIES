name: Validate Godot project

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "assets/**"
      - "data/terrain/**"
      - "libreville_dem.json"
      - "libreville_dem_f32.bin"
      - "project.godot"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

# Une seule validation utile à la fois : les commits récents remplacent les anciens.
# Évite d'empiler des imports Godot identiques sur plusieurs runners.
concurrency:
  group: validate-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Restore Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: ${{ runner.os }}-godot-4.3-${{ hashFiles('project.godot', 'assets/**', 'data/**', 'game/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.3-

      - name: Import project and parse scripts
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --verbose --quit

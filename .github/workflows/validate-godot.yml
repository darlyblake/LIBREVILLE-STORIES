name: Validate Godot project

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "game/**"
      - "data/osm/**"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --version

      - name: Parse project and scripts
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Load the playable main scene
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 5

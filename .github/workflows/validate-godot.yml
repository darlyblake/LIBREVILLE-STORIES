name: Validate Godot project
# Validation manuelle du snapshot OSM publié par le workflow d'extraction.

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "game/**"
      - "data/osm/**"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Test OSM neighbourhood relation assembly
        run: |
          python3 -m pip install --disable-pip-version-check shapely
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Validate OSM GeoJSON structure and extraction report
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          root = Path("data/osm")
          report = json.loads((root / "extraction-report.json").read_text())
          assert report.get("license") == "ODbL 1.0"
          assert report.get("attribution") == "© OpenStreetMap contributors"
          assert report.get("grid") == "4x4"
          assert len(report.get("tiles", [])) == 16

          def coordinates_are_finite(value):
              if isinstance(value, (int, float)):
                  return math.isfinite(value)
              if isinstance(value, list):
                  return all(coordinates_are_finite(item) for item in value)
              return True

          south, west, north, east = report["bbox_south_west_north_east"]

          def assert_in_bounds(value, label):
              if isinstance(value, list) and len(value) >= 2 and all(isinstance(v, (int, float)) for v in value[:2]):
                  lon, lat = value[:2]
                  assert math.isfinite(lon) and math.isfinite(lat), f"{label}: non-finite coordinate"
                  assert west - 1e-8 <= lon <= east + 1e-8, f"{label}: longitude outside map bounds ({lon})"
                  assert south - 1e-8 <= lat <= north + 1e-8, f"{label}: latitude outside map bounds ({lat})"
              elif isinstance(value, list):
                  for child in value:
                      assert_in_bounds(child, label)

          pois = json.loads((root / "pois.geojson").read_text())
          assert pois.get("type") == "FeatureCollection"
          assert len(pois.get("features", [])) == report["files"]["pois.geojson"]["features"]
          for index, feature in enumerate(pois.get("features", [])):
              geometry = feature.get("geometry") or {}
              assert geometry.get("type") == "Point", f"POI {index}: unexpected geometry"
              coords = geometry.get("coordinates") or []
              assert len(coords) >= 2 and coordinates_are_finite(coords), f"POI {index}: invalid coordinates"
              assert_in_bounds(coords, f"POI {index}")
              assert str(feature.get("properties", {}).get("name", "")).strip(), f"POI {index}: missing name"
          print(f"pois.geojson: {len(pois.get('features', []))} lieux nommés contrôlés.")
          environment = json.loads((root / "environment.geojson").read_text())
          assert environment.get("type") == "FeatureCollection"
          env_features = environment.get("features", [])
          assert len(env_features) == report["files"]["environment.geojson"]["features"]
          for index, feature in enumerate(env_features):
              geometry = feature.get("geometry") or {}
              kind = geometry.get("type")
              assert kind in {"LineString", "Polygon"}, f"environment {index}: unexpected {kind}"
              coords = geometry.get("coordinates") or []
              points = []
              def collect(value):
                  if isinstance(value, list) and len(value) >= 2 and all(isinstance(v, (int, float)) for v in value[:2]):
                      points.append(value)
                  elif isinstance(value, list):
                      for child in value:
                          collect(child)
              collect(coords)
              assert len(points) >= 2, f"environment {index}: empty geometry"
              assert_in_bounds(coords, f"environment {index}")
              for lon, lat, *rest in points:
                  assert math.isfinite(lon) and math.isfinite(lat)
                  assert west - 1e-8 <= lon <= east + 1e-8
                  assert south - 1e-8 <= lat <= north + 1e-8
          print(f"environment.geojson: {len(env_features)} éléments environnementaux dans l'emprise.")
 
          neighbourhoods = json.loads((root / "neighbourhoods.geojson").read_text())
          assert neighbourhoods.get("type") == "FeatureCollection"
          neighbourhood_features = neighbourhoods.get("features", [])
          assert len(neighbourhood_features) == report["files"]["neighbourhoods.geojson"]["features"]
          for index, feature in enumerate(neighbourhood_features):
              geometry = feature.get("geometry") or {}
              assert geometry.get("type") == "Polygon", f"neighbourhood {index}: unexpected geometry"
              coords = geometry.get("coordinates") or []
              assert coords and coordinates_are_finite(coords), f"neighbourhood {index}: invalid coordinates"
              assert_in_bounds(coords, f"neighbourhood {index}")
              assert all(len(ring) >= 4 and ring[0] == ring[-1] for ring in coords)
              assert str(feature.get("properties", {}).get("name", "")).strip(), f"neighbourhood {index}: missing name"
          print(f"neighbourhoods.geojson: {len(neighbourhood_features)} limites locales OSM contrôlées.")

          for filename, expected_type in (("roads.geojson", {"LineString", "MultiLineString"}),
                                           ("buildings.geojson", {"Polygon", "MultiPolygon"})):
              data = json.loads((root / filename).read_text())
              assert data.get("type") == "FeatureCollection", filename
              features = data.get("features", [])
              expected_count = report["files"][filename]["features"]
              assert len(features) == expected_count, f"{filename}: {len(features)} != {expected_count}"
              for index, feature in enumerate(features):
                  geometry = feature.get("geometry") or {}
                  kind = geometry.get("type")
                  coords = geometry.get("coordinates")
                  assert kind in expected_type, f"{filename} feature {index}: unexpected {kind}"
                  assert coords and coordinates_are_finite(coords), f"{filename} feature {index}: invalid coordinates"
                  assert_in_bounds(coords, f"{filename} feature {index}")
                  if kind == "LineString":
                      assert len(coords) >= 2
                  elif kind == "MultiLineString":
                      assert all(len(line) >= 2 for line in coords)
                  elif kind == "Polygon":
                      assert all(len(ring) >= 4 and ring[0] == ring[-1] for ring in coords)
                  elif kind == "MultiPolygon":
                      assert all(all(len(ring) >= 4 and ring[0] == ring[-1] for ring in polygon) for polygon in coords)
              print(f"{filename}: {len(features)} géométries contrôlées.")
          print("Rapport OSM, attribution, 16 secteurs et géométries : OK.")
          PY

      - name: Install Godot 4.3 and software display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl --fail --location --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --version

      - name: Parse project and scripts
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Render the main scene with OpenGL Compatibility
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.3-stable_linux.x86_64 \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --path . --quit-after 5 2>&1 | tee /tmp/libreville-map.log
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          log = Path("/tmp/libreville-map.log").read_text(errors="replace")
          report = json.loads(Path("data/osm/extraction-report.json").read_text())
          match = re.search(r"routes:\s*(\d+)\s*\|\s*bâtiments:\s*(\d+)\s*\|\s*lieux identifiables:\s*(\d+)\s*\|\s*éléments environnementaux:\s*(\d+)", log)
          assert match, "Les compteurs routes/bâtiments/lieux/environnement ne sont pas présents dans le journal Godot."
          roads, buildings, pois, environment = map(int, match.groups())
          expected_roads = report["files"]["roads.geojson"]["features"]
          expected_buildings = report["files"]["buildings.geojson"]["features"]
          assert roads == expected_roads, f"Routes chargées {roads}, attendues {expected_roads}"
          skipped_buildings = expected_buildings - buildings
          allowed_skips = max(25, expected_buildings // 1000)
          assert 0 < buildings <= expected_buildings, f"Nombre de bâtiments chargés invalide : {buildings}/{expected_buildings}"
          assert skipped_buildings <= allowed_skips, f"Trop de bâtiments ignorés par triangulation : {skipped_buildings} (maximum {allowed_skips})"
          expected_pois = report["files"]["pois.geojson"]["features"]
          expected_visible_pois = min(expected_pois, 450)
          assert pois == expected_visible_pois, f"Étiquettes de lieux chargées {pois}, attendues {expected_visible_pois} (limite d’affichage 450)"
          expected_environment = report["files"]["environment.geojson"]["features"]
          assert environment == expected_environment, f"Éléments environnementaux chargés {environment}, attendus {expected_environment}"
          print(f"Carte Godot cohérente : {roads} routes, {buildings}/{expected_buildings} bâtiments exploitables ({skipped_buildings} ignorés), {pois} étiquettes de lieux et {environment} éléments environnementaux.")
          PY
          if grep -q "SCRIPT ERROR" /tmp/libreville-map.log; then
            echo "GDScript runtime error detected."
            exit 1
          fi

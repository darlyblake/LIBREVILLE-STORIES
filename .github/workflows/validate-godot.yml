name: Validate Godot project

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "assets/**"
      - "data/**"
      - "tools/**"
      - "libreville_dem.json"
      - "libreville_dem_f32.bin"
      - "project.godot"
      - ".github/workflows/validate-godot.yml"
  pull_request:
    branches: [main]
    paths:
      - "game/**"
      - "assets/**"
      - "data/**"
      - "tools/**"
      - "libreville_dem.json"
      - "libreville_dem_f32.bin"
      - "project.godot"
      - ".github/workflows/validate-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

# Les validations sont mises en file : un nouveau push ne doit pas annuler
# l'import/parse Godot du commit précédent avant qu'il ait rendu son résultat.
concurrency:
  group: validate-godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Gabon calendar JSON
        run: python tools/validate_calendar.py
      - name: Validate opening-hours profiles
        run: python tools/validate_opening_hours.py
      - name: Validate life-simulation profiles
        run: python tools/validate_life_profiles.py
      - name: Validate occupation catalogue
        run: python tools/validate_occupation_catalog.py
      - name: Validate character library and GLB exports
        run: python tools/validate_character_library.py

  parse-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Restore Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: ${{ runner.os }}-godot-4.3-${{ hashFiles('project.godot', 'assets/**', 'data/**', 'game/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.3-

      - name: Import project and parse scripts
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --verbose --quit

      - name: Test world geometry sector splitting
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script tools/test_world_map_geometry_utils.gd

      - name: Inspect UAL1 and UAL2 animation clips and skeletons
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script tools/inspect_character_animations.gd

      - name: Inspect exported civilian GLB models
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script tools/inspect_npc_glb.gd

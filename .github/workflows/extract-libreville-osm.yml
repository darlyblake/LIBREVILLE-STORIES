name: Extract Libreville OSM map data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/map-generator/extract_libreville.py"
      - ".github/workflows/extract-libreville-osm.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: libreville-osm-extraction-pbf
  cancel-in-progress: true

jobs:
  extract-map:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore previous successful tile cache
        uses: actions/cache/restore@v4
        with:
          path: data/osm/.tiles
          key: ${{ runner.os }}-libreville-osm-v5-${{ hashFiles('tools/map-generator/extract_libreville.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-libreville-osm-v5-${{ hashFiles('tools/map-generator/extract_libreville.py') }}-
            ${{ runner.os }}-libreville-osm-v5-

      - name: Install OSM and geometry libraries
        run: python3 -m pip install --disable-pip-version-check osmium shapely

      - name: Extract fresh OSM data in 16 small sectors
        id: extract
        run: |
          python3 tools/map-generator/extract_libreville.py --grid 4 --timeout 45

      - name: Save successful tiles, including partial progress after a failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/osm/.tiles
          key: ${{ runner.os }}-libreville-osm-v5-${{ hashFiles('tools/map-generator/extract_libreville.py') }}-${{ github.run_id }}

      - name: Validate GeoJSON and extraction coverage
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          base = Path("data/osm")
          roads = json.loads((base / "roads.geojson").read_text())
          buildings = json.loads((base / "buildings.geojson").read_text())
          pois = json.loads((base / "pois.geojson").read_text())
          environment = json.loads((base / "environment.geojson").read_text())
          neighbourhoods = json.loads((base / "neighbourhoods.geojson").read_text())
          report = json.loads((base / "extraction-report.json").read_text())

          assert roads.get("type") == "FeatureCollection"
          assert buildings.get("type") == "FeatureCollection"
          assert pois.get("type") == "FeatureCollection"
          assert environment.get("type") == "FeatureCollection"
          assert neighbourhoods.get("type") == "FeatureCollection"
          assert report["files"]["neighbourhoods.geojson"]["features"] == len(neighbourhoods.get("features", []))
          assert report["files"]["environment.geojson"]["features"] == len(environment.get("features", []))
          assert len(environment.get("features", [])) > 0, "Aucune géométrie naturelle/eau/espace vert extraite."
          assert report["files"]["pois.geojson"]["features"] == len(pois.get("features", []))
          assert len(pois.get("features", [])) > 0, "Aucun lieu nommé extrait : refuser de publier une couche vide."
          assert len(roads.get("features", [])) >= 1000
          assert len(buildings.get("features", [])) >= 10000
          assert report["files"]["roads.geojson"]["features"] == len(roads["features"])
          assert report["files"]["buildings.geojson"]["features"] == len(buildings["features"])
          assert report.get("source_mode") in {"Overpass API", "Geofabrik Gabon PBF (fallback)"}
          assert report.get("license") == "ODbL 1.0"
          assert report.get("attribution") == "© OpenStreetMap contributors"
          assert report.get("grid") == "4x4"
          assert len(report.get("tiles", [])) == 16

          south, west, north, east = report["bbox_south_west_north_east"]

          def walk_points(value):
              if isinstance(value, list) and len(value) >= 2 and all(isinstance(v, (int, float)) for v in value[:2]):
                  yield value
              elif isinstance(value, list):
                  for child in value:
                      yield from walk_points(child)

          def check_geometry(feature, expected):
              geometry = feature.get("geometry") or {}
              kind = geometry.get("type")
              assert kind in expected, f"unexpected geometry type: {kind}"
              coords = geometry.get("coordinates") or []
              points = list(walk_points(coords))
              assert points, "empty geometry"
              for lon, lat, *rest in points:
                  assert math.isfinite(lon) and math.isfinite(lat)
                  assert west - 1e-8 <= lon <= east + 1e-8, f"longitude outside map: {lon}"
                  assert south - 1e-8 <= lat <= north + 1e-8, f"latitude outside map: {lat}"
              if kind in {"LineString", "MultiLineString"}:
                  lines = [coords] if kind == "LineString" else coords
                  assert all(len(line) >= 2 for line in lines)
              else:
                  polygons = [coords] if kind == "Polygon" else coords
                  for polygon in polygons:
                      assert polygon and all(len(ring) >= 4 and ring[0] == ring[-1] for ring in polygon)

          for feature in roads["features"]:
              check_geometry(feature, {"LineString", "MultiLineString"})
          for feature in environment["features"]:
              check_geometry(feature, {"LineString", "Polygon"})
          for feature in neighbourhoods["features"]:
              check_geometry(feature, {"Polygon"})
              assert feature.get("properties", {}).get("name"), "Limite locale sans nom"
          for feature in buildings["features"]:
              check_geometry(feature, {"Polygon", "MultiPolygon"})
          print("Secteurs vérifiés :", len(report["tiles"]))
          print("Routes vérifiées :", len(roads["features"]))
          for feature in pois["features"]:
              assert feature.get("geometry", {}).get("type") == "Point"
              lon, lat = feature["geometry"]["coordinates"]
              assert math.isfinite(lon) and math.isfinite(lat)
              assert west - 1e-8 <= lon <= east + 1e-8
              assert south - 1e-8 <= lat <= north + 1e-8
              assert feature.get("properties", {}).get("name")
          print("Bâtiments vérifiés :", len(buildings["features"]))
          print("Lieux identifiables vérifiés :", len(pois["features"]))
          print("Géométries environnementales vérifiées :", len(environment["features"]))
          print("Limites locales vérifiées :", len(neighbourhoods["features"]))
          print("Attribution :", report["attribution"])
          PY

      - name: Commit verified map data into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git -c rebase.autoStash=true rebase origin/main
          git add -f data/osm/roads.geojson data/osm/buildings.geojson data/osm/pois.geojson data/osm/environment.geojson data/osm/neighbourhoods.geojson data/osm/extraction-report.json
          if git diff --cached --quiet; then
            echo "Les données cartographiques sont déjà à jour."
          else
            git commit -m "Refresh verified Libreville OSM map data"
            git push origin HEAD:main
          fi

      - name: Publish verified map data artifact
        uses: actions/upload-artifact@v4
        with:
          name: libreville-osm-extraction
          path: |
            data/osm/roads.geojson
            data/osm/buildings.geojson
            data/osm/pois.geojson
            data/osm/environment.geojson
            data/osm/neighbourhoods.geojson
            data/osm/extraction-report.json
          if-no-files-found: error
          retention-days: 30

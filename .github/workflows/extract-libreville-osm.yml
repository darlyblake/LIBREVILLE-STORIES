name: Extract Libreville OSM map data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/map-generator/**"
      - ".github/workflows/extract-libreville-osm.yml"

permissions:
  contents: write

concurrency:
  group: libreville-osm-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract roads and building footprints by small tiles
        run: python3 -u tools/map-generator/extract_libreville.py --grid 3 --timeout 90

      - name: Commit extracted map source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add data/osm/roads.geojson data/osm/buildings.geojson data/osm/extraction-report.json
          if git diff --cached --quiet; then
            echo "No map data changes to commit."
          else
            git commit -m "Add extracted Libreville OSM roads and buildings"
            git push origin HEAD:main
          fi

      - name: Upload GeoJSON and extraction report
        uses: actions/upload-artifact@v4
        with:
          name: libreville-osm-extraction
          path: |
            data/osm/roads.geojson
            data/osm/buildings.geojson
            data/osm/extraction-report.json
          if-no-files-found: error
          retention-days: 14

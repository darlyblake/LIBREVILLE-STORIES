name: Extract Libreville OSM map data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/map-generator/**"
      - ".github/workflows/extract-libreville-osm.yml"

permissions:
  contents: read

concurrency:
  group: libreville-osm-extraction
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract roads and building footprints by small tiles
        run: python3 -u tools/map-generator/extract_libreville.py --grid 3 --timeout 90

      - name: Upload GeoJSON and extraction report
        uses: actions/upload-artifact@v4
        with:
          name: libreville-osm-extraction
          path: |
            data/osm/roads.geojson
            data/osm/buildings.geojson
            data/osm/extraction-report.json
          if-no-files-found: error
          retention-days: 14

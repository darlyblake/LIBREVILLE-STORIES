name: Download realistic vehicle models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-realistic-vehicles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download detailed player vehicles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models/vehicles/realistic/cars assets/models/vehicles/realistic/trucks
          download() {
            local url="$1"
            local target="$2"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 "$url" -o "$target"
            test "$(stat -c%s "$target")" -gt 100000
            test "$(head -c 4 "$target")" = "glTF"
            echo "Downloaded $(basename "$target"): $(stat -c%s "$target") bytes"
          }
          download "https://models.vinish.dev/realistic-cars/executive-sedan.glb" "assets/models/vehicles/realistic/cars/executive-sedan.glb"
          download "https://models.vinish.dev/realistic-cars/boxy-off-roader.glb" "assets/models/vehicles/realistic/cars/boxy-off-roader.glb"
          download "https://models.vinish.dev/realistic-cars/luxury-suv.glb" "assets/models/vehicles/realistic/cars/luxury-suv.glb"
          download "https://models.vinish.dev/trucks/tractor-unit.glb" "assets/models/vehicles/realistic/trucks/tractor-unit.glb"
          download "https://vinish-models.pages.dev/trucks/tipper-truck.glb" "assets/models/vehicles/realistic/trucks/tipper-truck.glb"
          cat > assets/models/vehicles/realistic/CREDITS.txt <<'EOF'
          Vehicle models by vinish.dev, used under Creative Commons Attribution 4.0 (CC BY 4.0).
          Sources:
          https://vinish.dev/free-3d-models/realistic-cars
          https://vinish.dev/free-3d-models/trucks
          Models are original generic vehicle designs, not replicas of branded manufacturers.
          EOF
      - name: Commit downloaded GLB assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/vehicles/realistic
          if git diff --cached --quiet; then
            echo "No new vehicle assets to commit."
            exit 0
          fi
          git commit -m "Add detailed realistic vehicle GLB models"
          git push origin HEAD:main

name: Import CC0 test character

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-test-character.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify Quaternius CC0 mannequin
        run: |
          mkdir -p assets/models/characters
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/webgl-games/opencity/main/assets/characters/UAL1_Standard.glb" \
            -o assets/models/characters/UAL1_Standard.glb
          ACTUAL="$(git hash-object assets/models/characters/UAL1_Standard.glb)"
          EXPECTED="473e59080288428d0b6da826ba19324d07b191f0"
          test "$ACTUAL" = "$EXPECTED"

      - name: Create a pull request for the verified binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c assets/import-quaternius-character
          git add assets/models/characters/UAL1_Standard.glb
          if git diff --cached --quiet; then
            echo "Le modèle est déjà présent sur la branche d'import."
            exit 0
          fi
          git commit -m "assets: add Quaternius CC0 test character"
          git push --force-with-lease origin assets/import-quaternius-character
          gh pr create \
            --base main \
            --head assets/import-quaternius-character \
            --title "assets: add Quaternius CC0 test character" \
            --body "Ajoute le mannequin temporaire Quaternius UAL1_Standard (CC0). Le fichier est vérifié par son Git blob SHA avant création de cette PR."

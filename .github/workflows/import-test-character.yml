name: Import CC0 test character

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-test-character.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and verify Quaternius CC0 mannequin
        run: |
          mkdir -p assets/models/characters
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/webgl-games/opencity/main/assets/characters/UAL1_Standard.glb" \
            -o assets/models/characters/UAL1_Standard.glb
          ACTUAL="$(git hash-object assets/models/characters/UAL1_Standard.glb)"
          EXPECTED="473e59080288428d0b6da826ba19324d07b191f0"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit the verified model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/characters/UAL1_Standard.glb
          if git diff --cached --quiet; then
            echo "Le modèle est déjà présent."
          else
            git commit -m "assets: add Quaternius CC0 test character"
            git push origin main
          fi
